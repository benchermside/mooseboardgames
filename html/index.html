<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Moose Board Games</title>
        <link rel="stylesheet" href="mooseboardgames.css">
        <script src="callAPI.js"></script>
        <script src="index.js" defer></script>
    </head>
    <body>
        <header>Moose Board Games</header>
        <main>
            <div id="view-games-lobby">
                <button>Create Game</button>
                <div id="join-game-error-message"></div>
                <div id="open-games"></div>
                <template id="open-game-template">
                    <div class="open-game">
                        <div class="game-name"></div>
                        <div class="player-count"></div>
                        <button>Join</button>
                    </div>
                </template>
            </div>
            <div id="starting-game-lobby" hidden>
                <div class="game-name"></div>
                <div id="player-views"></div>
                <template id="player-view-template">
                    <div class="player-view"></div>
                </template>
            </div>
        </main>
        <footer>&copy; 2026 Ben Chermside</footer>
    </body>
</html>
