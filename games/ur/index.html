<!DOCTYPE html>
<html>
    <head>
        <title>Royal Game of Ur</title>
        <meta charset="utf-8" />
        <link rel="stylesheet" href="images/generated/piles.css" />
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="./src/app.js"></script>
    </body>
        <style>
            .cell {
                border: 5px solid #555;
                width: 50px;
                height: 50px;
                line-height: 50px;
                text-align: center;
            }
            .cell.flower {
                background: url("images/tile-flower.svg") center / contain no-repeat;
            }
            .cell.pileCell {
                border-color: transparent;
                background-color: transparent;
            }
            .clickable {
                background-color: #d3d1c9;
            }
            .coinArea {
                position: relative;
                display: grid;
                grid-template: 1fr 1fr / 1fr 1fr;
            }
            .coinArea > .rollButton {
                position: absolute;
                inset: 0;
                display: none;
            }
            .coinArea.roll-needed > .rollButton {
                display: block;
            }
            .coin {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .coinArea.coins-disabled > .coin {
                filter: grayscale(0.7) opacity(0.75);
            }
            .piece, .pile {
                display: inline-block;
                width: 50px;
                height: 50px;
                vertical-align: middle;
            }
            /* The image itself comes from a .pile-{player}-{count} class in piles.css. */
            .pile {
                background-position: center;
                background-size: contain;
                background-repeat: no-repeat;
            }
            .piece.player-0 {
                background: url("images/generated/player-0-piece.svg") center / contain no-repeat;
            }
            .piece.player-1 {
                background: url("images/generated/player-1-piece.svg") center / contain no-repeat;
            }
            .red {
                background-color: red;
            }
            .hidden {
                display: none;
            }
            .rollButton {
                font-size: large;
            }
            .playArea {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .CoinsHolder {
                display: flex;
                flex-direction: column;
            }
            
        </style>
</html>
